# 本机构建用 JDK 21（系统默认 JDK 25 与 AGP 8.13 不兼容）。
# JDK 路径不放仓库（各人机器不同）：命令行构建把它写在 GRADLE_USER_HOME 下的 gradle.properties，
# 或用 Android Studio 内置 JBR；JDK 17/21 均可。

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dorg.gradle.kotlin.dsl.internal.io.timeout=600000
# Kotlin DSL accessors 生成的异步 IO 超时默认 60 秒；Gradle 发行版重装/杀软扫描时容易超时
# （报 "does not specify compileSdk" 的 TimeoutException），放宽到 10 分钟。
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 禁止 AGP 自动联网下载 SDK 组件（本机 SDK 仓库拉取不稳，会长时间挂住构建）。
# 缺组件时请用 Android Studio 的 SDK Manager 手动安装。
android.builder.sdkDownload=false

org.gradle.caching=false
# 本机构建缓存（build-cache-1 的 .part 写入）会被安全软件/沙箱拦截（"拒绝访问"），
# 导致 transform 任务随机失败。它只是加速项，关掉不影响正确性。

kotlin.code.style=official
ksp.incremental=true
